# Build the actual SDK-style web project (this repository has no .sln).
trigger:
- master

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UseDotNet@2
  displayName: Install .NET 10 SDK
  inputs:
    packageType: sdk
    version: '10.0.x'

- script: dotnet restore pipelines-dotnet-core.csproj
  displayName: Restore dependencies

- script: dotnet build pipelines-dotnet-core.csproj --configuration Release --no-restore --warnaserror
  displayName: Compile application

- script: dotnet publish pipelines-dotnet-core.csproj --configuration Release --no-build --output $(Build.ArtifactStagingDirectory)/site
  displayName: Publish application

- publish: $(Build.ArtifactStagingDirectory)/site
  artifact: website
