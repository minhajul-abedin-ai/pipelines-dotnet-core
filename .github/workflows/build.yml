name: Build ASP.NET Core
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore pipelines-dotnet-core.csproj
      - run: dotnet build pipelines-dotnet-core.csproj --configuration Release --no-restore --warnaserror
      - run: dotnet publish pipelines-dotnet-core.csproj --configuration Release --no-build --output published
